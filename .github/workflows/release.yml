name: Release public binaries
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/harness -> target
            packages/cli -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:scripts
      - run: npm run build:all:exclude-desktop
      - run: cargo test --manifest-path packages/cli/Cargo.toml --locked
      - run: npm run llama:sync -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --portable
      - run: npm run pack:harness
      - run: npm run pack:cli
      - run: npm run package:installers -- --exclude-desktop
      - run: node scripts/verify-installer.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npm run version:check
      - run: npm run sdk:test
      - run: npm run pack:sdk-js
      - run: npm run pack:sdk-python
      - uses: actions/upload-artifact@v7
        with:
          name: sdks
          path: dist/*
          if-no-files-found: error
  collect:
    needs: [binaries, sdks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: jynx-release-files
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [collect]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jynx-release-files
          path: release-assets
      - name: Publish matching source and binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')"
          test "$RELEASE_TAG" = "$expected"
          printf 'Jynx public release. Setup packages include CLI, Harness, and llama.cpp CPU/default GPU runtimes. Native archives include LICENSE and COPYRIGHT.\n\nCorresponding source: https://github.com/%s/tree/%s\nBuild instructions: https://github.com/%s/blob/%s/docs/development/building.md\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" > release-notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Jynx ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > published-assets.txt
          while IFS= read -r asset; do
            if test ! -f "release-assets/$asset"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < published-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false
