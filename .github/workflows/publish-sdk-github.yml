name: Publish SDK to GitHub Packages
on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Attempt to replace the exact current version; restores the previous GitHub version if publishing fails'
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: github-sdk-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://npm.pkg.github.com/
          scope: '@r3fstudio'
      - run: npm ci
      - run: npm run version:check
      - run: npm run sdk:test:js
      - run: |
          if [ "$REPLACE_EXISTING" = true ]; then
            npm run publish:sdk:github -- --replace-existing
          else
            npm run publish:sdk:github
          fi
        env:
          REPLACE_EXISTING: ${{ inputs.replace_existing || false }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always() && inputs.replace_existing
        with:
          name: github-sdk-replacement-backup
          path: .cache/github-sdk-backup/*
          if-no-files-found: ignore
          retention-days: 7
