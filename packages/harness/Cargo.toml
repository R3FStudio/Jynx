[workspace]
members = [
  "protocol",
  "security",
  "sandbox",
  "context",
  "tools",
  "model",
  "mcp",
  "agent",
  "storage",
  "server"
]
resolver = "2"

[workspace.package]
authors = ["R3F Studio"]
license = "GPL-3.0-only"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
ignore = "0.4"
futures-util = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
