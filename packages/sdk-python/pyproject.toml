[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "R3F Studio"}]
name = "jynx-python-sdk"
version = "0.0.1"
description = "Python client for the Jynx local model API"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["jynx_sdk*"]
